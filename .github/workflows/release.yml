# Push a tag like v1.2.0 to build, sign and publish a release.
# Needs (Settings → Secrets and variables → Actions):
#   secret   UPDATE_SIGNING_KEY  private key from: go run ./tools/sign genkey
#   variable UPDATE_PUBLIC_KEY   matching public key
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          PUBKEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PUBKEY" ]; then
            echo "::error::Repository variable UPDATE_PUBLIC_KEY is not set"
            exit 1
          fi
          go vet ./...
          mkdir dist
          ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.repo=${GITHUB_REPOSITORY} -X main.updatePublicKey=${PUBKEY}"
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            ext=""
            [ "$goos" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -trimpath -ldflags "$ldflags" -o "dist/p2proxy-$goos-$goarch$ext" .
          done

          # Ready-to-run Windows bundles for first-time installs.
          for goarch in amd64 arm64; do
            dir="p2proxy-windows-$goarch"
            mkdir "$dir"
            cp "dist/p2proxy-windows-$goarch.exe" "$dir/p2proxy.exe"
            cp start-server.bat start-client.bat clash-A.yaml README.md LICENSE "$dir/"
            zip -qr "dist/$dir.zip" "$dir"
          done

          cd dist
          sha256sum p2proxy-* > checksums.txt

      - name: Sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: go run ./tools/sign -tag "${GITHUB_REF_NAME}" dist/checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
